<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mémo, nouvelle version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : colonne unique à la largeur d'un téléphone, barre d'onglets fixe en bas,
   fiches en cartes, révision plein écran. Tuile encre et bleu Mémo de l'écosystème, or des Éclats. */
:root{
  --fond:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --encre:#12161C; --texte:#1B2130; --doux:#5E6778; --trait:#DDE3EC;
  --memo:#1E7FE6; --memo-doux:#E3EFFD; --memo-vif:#4EA8FF;
  --eclat:#E8960F; --eclat-doux:#FFF1D9;
  --ok:#17905B; --ok-doux:#E1F4EA; --ko:#D93B3F; --ko-doux:#FCE6E6;
  --tuile:#12161C;
  --f-titre:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-texte:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --r-s:12px;
  --ombre:0 1px 2px rgba(18,22,28,.06), 0 6px 20px rgba(18,22,28,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fond:#0C0F14; --surface:#161B23; --surface-2:#1C222C; --encre:#F1F4F8; --texte:#E6EAF0; --doux:#9AA4B4; --trait:#29313D;
  --memo:#4EA8FF; --memo-doux:#16283F; --memo-vif:#7CC0FF;
  --eclat:#FFB13C; --eclat-doux:#33260F;
  --ok:#3DCB8A; --ok-doux:#10291E; --ko:#FF6B6E; --ko-doux:#351717;
  --tuile:#232A35; --ombre:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#0C0F14; --surface:#161B23; --surface-2:#1C222C; --encre:#F1F4F8; --texte:#E6EAF0; --doux:#9AA4B4; --trait:#29313D;
  --memo:#4EA8FF; --memo-doux:#16283F; --memo-vif:#7CC0FF;
  --eclat:#FFB13C; --eclat-doux:#33260F;
  --ok:#3DCB8A; --ok-doux:#10291E; --ko:#FF6B6E; --ko-doux:#351717;
  --tuile:#232A35; --ombre:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.45 var(--f-texte);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--memo);outline-offset:2px;border-radius:10px}
svg.i{width:1.25em;height:1.25em;fill:currentColor;flex:none;vertical-align:-.2em}
.app{max-width:460px;margin:0 auto;min-height:100%;position:relative;padding-inline:16px;padding-block:0 104px}
h1,h2,h3{font-family:var(--f-titre);color:var(--encre);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.etiquette{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.chiffre{font-variant-numeric:tabular-nums}

/* barre du haut */
.haut{display:flex;align-items:center;gap:10px;padding-block:16px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fond);z-index:5}
.tuile{width:36px;height:36px;border-radius:10px;background:var(--tuile);display:grid;place-items:center;flex:none}
.tuile svg{width:24px;height:24px;fill:#4EA8FF}
.marque{font-family:var(--f-titre);font-weight:800;font-size:20px;color:var(--encre);flex:1}
.pastille{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:var(--ombre)}
.pastille.serie{color:#E8590C}
.pastille.eclats{color:var(--eclat)}
.eclat-glyphe{width:1.05em;height:1.05em;fill:var(--eclat);vertical-align:-.15em}

/* cartes */
.carte{background:var(--surface);border-radius:var(--r);box-shadow:var(--ombre);padding:18px}
.pile{display:grid;gap:14px}
.section{display:grid;gap:10px;margin-top:22px}
.section>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lien{color:var(--memo);font-weight:600;font-size:14px}

/* aujourd'hui */
.heros{background:var(--tuile);color:#fff;border-radius:22px;padding:20px;display:grid;gap:14px;position:relative;overflow:hidden}
.heros h1{color:#fff}
.heros p{margin:0;color:#B8C2D0}
.heros .ligne{display:flex;gap:18px;flex-wrap:wrap}
.heros .val{font-family:var(--f-titre);font-size:26px;font-weight:800;color:#fff;line-height:1}
.heros .lib{font-size:13px;color:#9AA7B8}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:16px}
.bouton.plein{background:var(--memo-vif);color:#081523}
.bouton.memo{background:var(--memo);color:#fff}
.bouton.fantome{background:var(--surface-2);color:var(--encre)}
.bouton.large{width:100%}
.anneau{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(78,168,255,.12)}
.objectif{display:flex;align-items:center;gap:14px}
.jauge{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--memo) calc(var(--p)*1%), var(--trait) 0);display:grid;place-items:center;flex:none}
.jauge span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--encre)}
.continuer{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center}
.continuer img,.miniature{width:64px;height:48px;border-radius:10px;object-fit:cover;background:var(--trait)}
.barre{height:6px;border-radius:99px;background:var(--trait);overflow:hidden}
.barre i{display:block;height:100%;background:var(--memo);border-radius:99px}
.sous{font-size:13px;color:var(--doux)}
.defiler{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.defiler::-webkit-scrollbar{display:none}
.decouverte{flex:none;width:136px;background:var(--surface);border-radius:var(--r-s);box-shadow:var(--ombre);overflow:hidden}
.decouverte img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.decouverte div{padding:8px 10px;font-weight:600;font-size:14px;line-height:1.25}
.decouverte small{display:block;color:var(--doux);font-weight:500;font-size:12px}

/* listes */
.recherche{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;min-height:48px;box-shadow:var(--ombre);color:var(--doux)}
.recherche input{border:0;background:none;flex:1;font:inherit;color:var(--texte);min-width:0;outline:none}
.puces{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;box-shadow:var(--ombre);white-space:nowrap}
.puce[aria-pressed="true"]{background:var(--encre);color:var(--fond)}
.ligne-liste{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--trait);text-align:left;width:100%}
.ligne-liste:last-child{border-bottom:0}
.ic-liste{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px}
.ligne-liste .nom{font-weight:700;color:var(--encre);hyphens:none;overflow-wrap:normal}
.ligne-liste .meta{display:flex;gap:10px;align-items:center;margin-top:5px}
.ligne-liste .barre{flex:1;max-width:120px}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--memo-doux);color:var(--memo);white-space:nowrap}
.badge.eclat{background:var(--eclat-doux);color:var(--eclat)}
.titre-cat{display:flex;align-items:center;gap:8px;margin-top:20px}
.titre-cat .pct{margin-left:auto;font-size:13px;color:var(--doux);font-weight:600}

/* page liste */
.retour{display:inline-flex;align-items:center;gap:6px;color:var(--doux);font-weight:600;padding-block:14px 6px}
.entete-liste{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.segment{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:18px}
.segment button{padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--doux)}
.segment button[aria-pressed="true"]{background:var(--surface);color:var(--encre);box-shadow:var(--ombre)}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.fiche{background:var(--surface);border-radius:var(--r-s);box-shadow:var(--ombre);overflow:hidden;text-align:left}
.fiche img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--trait)}
.fiche .corps{padding:9px 10px 11px}
.fiche .nom{font-weight:700;font-size:14px;line-height:1.25;color:var(--encre)}
.fiche .sec{font-size:12px;color:var(--doux);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.niveaux{display:flex;gap:3px;margin-top:7px}
.niveaux i{height:4px;flex:1;border-radius:9px;background:var(--trait)}
.niveaux i.on{background:var(--memo)}
.tableau{margin-top:14px;overflow-x:auto;background:var(--surface);border-radius:var(--r-s);box-shadow:var(--ombre)}
.tableau table{border-collapse:collapse;min-width:100%;font-size:14px}
.tableau th,.tableau td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--trait);white-space:nowrap}
.tableau th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux);position:sticky;top:0;background:var(--surface)}
.tableau td:first-child{font-weight:700;color:var(--encre);position:sticky;left:0;background:var(--surface)}

/* feuille de détail */
.voile{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.voile.ouvert{opacity:1;pointer-events:auto}
.feuille{background:var(--surface);width:100%;max-width:460px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;transform:translateY(30px);transition:transform .25s;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.voile.ouvert .feuille{transform:none}
.feuille img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.feuille .contenu{padding:18px 18px 0;display:grid;gap:14px}
.feuille dl{display:grid;gap:10px;margin:0}
.feuille dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--doux)}
.feuille dd{margin:2px 0 0;color:var(--encre);font-weight:500}
.poignee{width:44px;height:5px;border-radius:9px;background:var(--trait);margin:10px auto 0}

/* séance */
.seance{position:fixed;inset:0;background:var(--fond);z-index:30;display:none;overflow:auto}
.seance.ouverte{display:block}
.seance .app{padding-bottom:28px}
.progres-seance{display:flex;align-items:center;gap:12px;padding-block:16px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fond);z-index:2}
.progres-seance .barre{flex:1;height:8px}
.progres-seance .barre i{transition:width .3s}
.question{display:grid;gap:14px}
.question .visuel{border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre);background:var(--trait)}
.question .visuel img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.question .enonce{font-family:var(--f-titre);font-size:22px;font-weight:700;color:var(--encre);line-height:1.2}
.question .contexte{display:flex;align-items:center;gap:10px}
.question .contexte img{width:56px;height:42px;border-radius:9px;object-fit:cover}
.choix{display:grid;gap:10px}
.option{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);box-shadow:var(--ombre);font-weight:600;min-height:56px;border:2px solid transparent;transition:transform .08s}
.option:active{transform:scale(.99)}
.option .lettre{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--doux);flex:none}
.option.bonne{border-color:var(--ok);background:var(--ok-doux)}
.option.bonne .lettre{background:var(--ok);color:#fff}
.option.fausse{border-color:var(--ko);background:var(--ko-doux)}
.option.fausse .lettre{background:var(--ko);color:#fff}
.option[disabled]{cursor:default}
.retour-fiche{border-radius:var(--r);padding:16px;display:grid;gap:10px}
.retour-fiche.ok{background:var(--ok-doux)}
.retour-fiche.ko{background:var(--ko-doux)}
.retour-fiche .verdict{font-family:var(--f-titre);font-weight:800;font-size:18px}
.retour-fiche.ok .verdict{color:var(--ok)}
.retour-fiche.ko .verdict{color:var(--ko)}
.retour-fiche dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
.retour-fiche dt{color:var(--doux)}
.retour-fiche dd{margin:0;color:var(--encre);font-weight:500}
.gain{font-weight:700;color:var(--eclat);display:inline-flex;align-items:center;gap:4px}
.suite-fixe{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 8px 24px rgba(30,127,230,.35)}

/* fin de séance */
.fin{display:grid;gap:16px;text-align:center;padding-top:30px}
.fin .score{font-family:var(--f-titre);font-size:64px;font-weight:800;color:var(--encre);line-height:1}
.fin .eclats-gagnes{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-titre);font-size:30px;font-weight:800;color:var(--eclat);background:var(--eclat-doux);border-radius:18px;padding:14px 20px;justify-self:center}
.fin .eclats-gagnes svg{width:30px;height:30px;fill:var(--eclat)}
.bilan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bilan div{background:var(--surface);border-radius:var(--r-s);box-shadow:var(--ombre);padding:12px 8px}
.bilan b{display:block;font-family:var(--f-titre);font-size:22px;color:var(--encre)}
.bilan span{font-size:12px;color:var(--doux)}
@keyframes monte{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.monte{animation:monte .35s ease both}

/* progrès */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border-radius:var(--r-s);box-shadow:var(--ombre);padding:14px}
.stat b{display:block;font-family:var(--f-titre);font-size:26px;color:var(--encre);line-height:1.1}
.stat span{font-size:13px;color:var(--doux)}
.calendrier{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.calendrier i{aspect-ratio:1;border-radius:4px;background:var(--trait)}
.calendrier i[data-n="1"]{background:color-mix(in srgb,var(--memo) 35%,var(--trait))}
.calendrier i[data-n="2"]{background:color-mix(in srgb,var(--memo) 65%,var(--trait))}
.calendrier i[data-n="3"]{background:var(--memo)}
.boites{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.boites div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.boites .col{width:100%;border-radius:8px 8px 3px 3px;background:var(--memo)}
.boites .col.b1{background:var(--ko)}
.boites .col.b2{background:color-mix(in srgb,var(--ko) 45%,var(--memo))}
.boites small{font-size:12px;color:var(--doux);text-align:center;line-height:1.2}
.boites b{font-size:13px;color:var(--encre)}
.cat-maitrise{display:grid;gap:12px}
.cat-maitrise>div{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.cat-maitrise b{font-weight:600;color:var(--encre)}
.cat-maitrise .pct{text-align:right;font-weight:700;color:var(--doux)}
.note-conception{font-size:13px;color:var(--doux);background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;border:1px dashed var(--trait)}
.note-conception b{color:var(--encre)}

/* onglets */
.onglets{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom,0px)}
.onglets nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.onglets button{display:grid;justify-items:center;gap:3px;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--doux)}
.onglets button svg{width:24px;height:24px}
.onglets button[aria-current="page"]{color:var(--memo)}
.onglets .principal span.rond{width:46px;height:46px;border-radius:14px;background:var(--memo);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(30,127,230,.35)}
.bandeau{font-size:12px;color:var(--doux);text-align:center;padding:10px 0 0}
/* quiz du jour, barème, saisie, correction */
.quiz-jour{background:var(--surface);border-radius:22px;padding:18px;display:grid;gap:12px;box-shadow:var(--ombre);border:2px solid color-mix(in srgb,var(--eclat) 45%,transparent)}
.quiz-jour h1{font-size:24px}
.bareme{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.palier{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;display:grid;gap:2px}
.palier b{font-family:var(--f-titre);font-size:14px;color:var(--encre);white-space:nowrap}
.palier span{font-size:10.5px;color:var(--doux);line-height:1.2}
.palier.atteint{background:var(--eclat-doux);outline:2px solid var(--eclat)}
.palier.atteint b{color:var(--eclat)}
.bouton.eclat{background:var(--eclat);color:#231500}
.saisie{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.saisie input{min-height:54px;border-radius:14px;border:2px solid var(--trait);background:var(--surface);color:var(--encre);font:600 18px var(--f-texte);padding:0 14px;min-width:0}
.saisie input:focus{border-color:var(--memo);outline:none}
.saisie-faite{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--trait)}
.saisie-faite.ok{border-color:var(--ok)}
.saisie-faite.ko{border-color:var(--ko)}
.saisie-faite b{font-size:18px;color:var(--encre)}
.corriger{justify-self:start;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--doux);padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--trait)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="racine"></div>
<div class="seance" id="seance" role="dialog" aria-label="Séance de révision"></div>

<script>
const D = JSON.parse(document.getElementById('donnees').textContent);
const $ = s => document.querySelector(s);
const ic = (n, v = 'regular') => `<svg class="i" viewBox="0 0 256 256" aria-hidden="true">${D.icones[n + '-' + v] || ''}</svg>`;
const logo = () => `<svg viewBox="0 0 256 256" aria-hidden="true"><path d="${D.logo.path}"/></svg>`;
const eclat = (cls = 'eclat-glyphe') => `<svg class="${cls}" viewBox="0 0 256 256" aria-hidden="true"><path d="${D.eclat.path}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const nomCat = Object.fromEntries(D.categories.map(([id, nom, icone]) => [id, {nom, icone}]));

/* ---------- état : boîtes de révision (5 niveaux), graine déterministe pour la démo ---------- */
function alea(graine) { let x = graine; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
const r = alea(42);
const ETAT_DEFAUT = {eclats: 1240, serie: 6, jour: 0, boites: {}, faits: 0, quizJour: null};
let etat = ETAT_DEFAUT;
try { const s = JSON.parse(localStorage.getItem('memo-maquette-v2') || 'null'); if (s) etat = s; } catch {}
const tous = D.listes.flatMap(l => l.items.map(it => ({...it, liste: l})));
for (const it of tous) if (!(it.id in etat.boites)) etat.boites[it.id] = Math.floor(r() * 6); // 0 = jamais vue
function sauver() { try { localStorage.setItem('memo-maquette-v2', JSON.stringify(etat)); } catch {} }
const niveau = id => etat.boites[id] || 0;
const aRevoir = () => tous.filter(it => niveau(it.id) >= 1 && niveau(it.id) <= 2);
const nouvelles = () => tous.filter(it => niveau(it.id) === 0);
const maitrise = l => Math.round(100 * l.items.reduce((s, it) => s + niveau(it.id), 0) / (l.items.length * 5));
function maitriseCatalogue(c) { const l = D.listes.find(x => x.id === c.id); if (l) return maitrise(l); let h = 0; for (const ch of c.id) h = (h * 31 + ch.charCodeAt(0)) % 997; return h % 3 === 0 ? 0 : 8 + h % 70; }

/* ---------- navigation ---------- */
let page = 'aujourdhui', listeOuverte = null, affichage = 'fiches', filtreCat = 'tout', recherche = '';
const ONGLETS = [['aujourdhui', 'Aujourd\'hui', 'house'], ['listes', 'Listes', 'books'], ['reviser', 'Réviser', 'lightning'], ['progres', 'Progrès', 'chart-line-up']];
function rendreOnglets() {
  $('#onglets nav').innerHTML = ONGLETS.map(([id, lib, n]) => id === 'reviser'
    ? `<button class="principal" data-onglet="${id}"><span class="rond">${ic(n, 'fill')}</span>${lib}</button>`
    : `<button data-onglet="${id}" ${page === id || (id === 'listes' && page === 'liste') ? 'aria-current="page"' : ''}>${ic(n, page === id ? 'fill' : 'regular')}${lib}</button>`).join('');
  document.querySelectorAll('[data-onglet]').forEach(b => b.onclick = () => {
    if (b.dataset.onglet === 'reviser') return lancerSeance();
    page = b.dataset.onglet; rendre(); window.scrollTo({top: 0});
  });
}
function haut(titre) {
  return `<header class="haut"><div class="tuile">${logo()}</div><div class="marque">${titre}</div>
    <span class="pastille serie" title="Série de jours">${ic('fire', 'fill')}<span class="chiffre">${etat.serie}</span></span>
    <span class="pastille eclats" title="Éclats">${eclat()}<span class="chiffre">${etat.eclats.toLocaleString('fr-FR')}</span></span></header>`;
}

/* ---------- Aujourd'hui ---------- */
const BAREME = [[0, 0], [10, 10], [13, 25], [16, 45], [18, 75], [20, 120]];   // [à partir de n bonnes réponses, Éclats]
const gainPour = n => BAREME.reduce((g, [seuil, e]) => n >= seuil ? e : g, 0);
function blocBareme(score) {
  const paliers = [['0 à 9', 0, 0], ['10 à 12', 10, 10], ['13 à 15', 13, 25], ['16 ou 17', 16, 45], ['18 ou 19', 18, 75], ['20', 20, 120]];
  return `<div class="bareme">${paliers.map(([lib, seuil, e], i) => {
    const suivant = paliers[i + 1] ? paliers[i + 1][1] : 21;
    const atteint = score !== undefined && score >= seuil && score < suivant;
    return `<div class="palier ${atteint ? 'atteint' : ''}"><b>${e ? `${e} ${eclat()}` : '0'}</b><span>${lib}</span></div>`; }).join('')}</div>`;
}
function vueAujourdhui() {
  const dues = aRevoir().length, neuves = Math.min(nouvelles().length, 5);
  const enCours = [...D.listes].sort((a, b) => maitrise(b) - maitrise(a))[1];
  const objectif = Math.min(100, Math.round(100 * etat.faits / 20));
  const qj = etat.quizJour;
  return haut('Mémo') + `
  <section class="quiz-jour monte">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span class="etiquette" style="color:var(--eclat)">Quiz du jour</span>
      <span class="sous">${qj ? 'Nouveau quiz demain' : '20 questions · toutes les listes'}</span></div>
    ${qj
      ? `<h1><span class="chiffre">${qj.score} / 20</span> · +${qj.gain} ${eclat()}</h1><p class="sous" style="margin:0">Fait aujourd'hui. Reviens demain pour un nouveau tirage.</p>${blocBareme(qj.score)}`
      : `<h1>N'importe quelle liste, 20 questions</h1><p class="sous" style="margin:0">Une seule tentative par jour. Tu tapes tes réponses ; plus tu en trouves, plus tu gagnes d'Éclats.</p>${blocBareme()}
         <button class="bouton eclat large" id="quiz-jour">${ic('trophy', 'fill')} Tenter le quiz du jour</button>`}
  </section>

  <section class="heros section">
    <div class="anneau"></div>
    <span class="etiquette" style="color:#8FA0B6">Révision du jour</span>
    <h1>${dues + neuves} fiches t'attendent</h1>
    <div class="ligne">
      <div><div class="val chiffre">${dues}</div><div class="lib">à revoir</div></div>
      <div><div class="val chiffre">${neuves}</div><div class="lib">nouvelles</div></div>
      <div><div class="val chiffre">≈ ${Math.max(2, Math.round((dues + neuves) * 0.35))} min</div><div class="lib">durée</div></div>
    </div>
    <button class="bouton plein large" id="go">${ic('play', 'fill')} Réviser</button>
    <p style="font-size:13px">Les révisions ne rapportent pas d'Éclats : elles font monter tes fiches vers « Acquise ».</p>
  </section>

  <section class="section"><div class="carte objectif">
    <div class="jauge" style="--p:${objectif}"><span class="chiffre">${objectif}%</span></div>
    <div><h3>Objectif du jour</h3><div class="sous">${etat.faits} / 20 réponses · la série passe à ${etat.serie + 1} jours à 20</div></div>
  </div></section>

  <section class="section"><header><h2>Continuer</h2></header>
    <button class="carte continuer" data-liste="${enCours.id}">
      <img src="${enCours.items[0].image}" alt="">
      <div style="text-align:left"><h3>${esc(enCours.nom)}</h3><div class="barre" style="margin:7px 0 4px"><i style="width:${maitrise(enCours)}%"></i></div><div class="sous">${maitrise(enCours)} % maîtrisé · ${enCours.total} fiches</div></div>
      ${ic('caret-right')}
    </button>
  </section>

  <section class="section"><header><h2>À découvrir</h2><button class="lien" data-onglet-lien="listes">Tout voir</button></header>
    <div class="defiler">${nouvelles().slice(0, 8).map(it => `<button class="decouverte" data-fiche="${it.id}"><img src="${it.image}" alt=""><div>${esc(it.nom)}<small>${esc(it.liste.nom)}</small></div></button>`).join('')}</div>
  </section>

  <p class="note-conception"><b>Maquette.</b> Les listes Grands peintres, Mythologie grecque, Fromages et Monuments sont réelles (échantillon de 12 à 14 fiches chacune) ; la progression, la série et les Éclats sont simulés et restent sur ton appareil. <button class="lien" id="raz">Remettre le quiz du jour à zéro</button></p>`;
}

/* ---------- Listes ---------- */
function vueListes() {
  const cats = D.categories.filter(([id]) => D.catalogue.some(c => c.categorie === id));
  const q = recherche.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const garde = c => (filtreCat === 'tout' || c.categorie === filtreCat) && (!q || c.nom.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
  const blocs = cats.map(([id, nom, icone]) => {
    const ls = D.catalogue.filter(c => c.categorie === id && garde(c)).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    if (!ls.length) return '';
    const moy = Math.round(ls.reduce((s, c) => s + maitriseCatalogue(c), 0) / ls.length);
    return `<div class="titre-cat"><span style="font-size:20px">${icone}</span><h2>${esc(nom)}</h2><span class="pct chiffre">${moy} %</span></div>
      <div class="carte" style="padding:4px 14px">${ls.map(c => {
        const reelle = D.listes.find(l => l.id === c.id), m = maitriseCatalogue(c);
        const dus = reelle ? reelle.items.filter(it => niveau(it.id) >= 1 && niveau(it.id) <= 2).length : 0;
        return `<button class="ligne-liste" data-liste="${c.id}"><span class="ic-liste">${c.icone}</span>
          <span><span class="nom">${esc(c.nom)}</span><span class="meta"><span class="barre"><i style="width:${m}%"></i></span><span class="sous chiffre">${m} %</span></span></span>
          ${dus ? `<span class="badge">${dus} à revoir</span>` : m === 0 ? `<span class="badge eclat">Nouveau</span>` : ic('caret-right')}</button>`; }).join('')}</div>`;
  }).join('');
  return haut('Listes') + `
    <div class="pile"><label class="recherche">${ic('magnifying-glass')}<input id="rech" type="search" placeholder="Chercher parmi ${D.catalogue.length} listes" value="${esc(recherche)}" aria-label="Chercher une liste"></label>
    <div class="puces" role="group" aria-label="Catégories">${[['tout', 'Tout']].concat(cats.map(([id, nom, icone]) => [id, icone + ' ' + nom])).map(([id, lib]) => `<button class="puce" data-cat="${id}" aria-pressed="${filtreCat === id}">${esc(lib)}</button>`).join('')}</div></div>
    ${blocs || '<p class="sous" style="margin-top:24px">Aucune liste ne correspond.</p>'}`;
}

/* ---------- Page d'une liste ---------- */
function vueListe() {
  const c = D.catalogue.find(x => x.id === listeOuverte);
  const l = D.listes.find(x => x.id === listeOuverte);
  if (!l) return `<button class="retour" id="retour">${ic('arrow-left')} Listes</button>
    <div class="carte" style="margin-top:10px"><h2>${c.icone} ${esc(c.nom)}</h2><p class="sous">Dans la maquette, seules quatre listes sont remplies : Grands peintres, Mythologie grecque, Fromages et Monuments.</p></div>`;
  const m = maitrise(l);
  return `<button class="retour" id="retour">${ic('arrow-left')} Listes</button>
    <div class="entete-liste"><div><span class="etiquette">${esc(nomCat[l.categorie]?.nom || '')}</span><h1>${l.icone} ${esc(l.nom)}</h1>
      <div class="sous" style="margin-top:4px">${l.total} fiches · ${l.colonnes.join(' · ')}</div></div>
      <div class="jauge" style="--p:${m}"><span class="chiffre">${m}%</span></div></div>
    <div class="actions"><button class="bouton memo" data-reviser="${l.id}">${ic('lightning', 'fill')} Réviser</button><button class="bouton fantome" data-reviser="${l.id}" data-mode="nouvelles">${ic('sparkle')} Découvrir</button></div>

      : `<div class="tableau"><table><thead><tr><th>Nom</th>${l.colonnes.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${l.items.map(it => `<tr data-fiche="${it.id}"><td>${esc(it.nom)}</td>${it.champs.map(([, v]) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    <p class="note-conception" style="margin-top:18px"><b>Lecture d'abord.</b> Toucher une fiche l'ouvre en grand ; l'édition (texte, image, suppression) passe dans un menu ⋯ de la fiche, loin des gestes courants.</p>`;
}

function fermerFiche() { $('#voile').classList.remove('ouvert'); }
$('#voile').onclick = e => { if (e.target.id === 'voile') fermerFiche(); };

/* ---------- Progrès ---------- */
function vueProgres() {
  const cmpt = [0, 0, 0, 0, 0, 0]; tous.forEach(it => cmpt[niveau(it.id)]++);
  const maxB = Math.max(...cmpt.slice(1), 1);
  const rr = alea(7), jours = Array.from({length: 84}, (_, i) => i > 83 - etat.serie ? 3 : rr() < .55 ? Math.ceil(rr() * 3) : 0);
  const cats = D.categories.filter(([id]) => D.catalogue.some(c => c.categorie === id)).map(([id, nom, icone]) => {
    const ls = D.catalogue.filter(c => c.categorie === id);
    return [icone, nom, Math.round(ls.reduce((s, c) => s + maitriseCatalogue(c), 0) / ls.length)];
  }).sort((a, b) => b[2] - a[2]);
  const libs = ['', 'À revoir', 'Fragile', 'En cours', 'Solide', 'Acquise'];
  return haut('Progrès') + `
    <div class="stats monte">
      <div class="stat"><b class="chiffre">${cmpt[5] + cmpt[4]}</b><span>fiches solides ou acquises</span></div>
      <div class="stat"><b class="chiffre">${etat.serie} j</b><span>série en cours · record 23 j</span></div>
      <div class="stat"><b class="chiffre">87 %</b><span>de réussite sur 7 jours</span></div>
      <div class="stat"><b class="chiffre" style="color:var(--eclat)">${eclat()} 310</b><span>Éclats gagnés ce mois</span></div>
    </div>
    <section class="section"><header><h2>Mémoire</h2><span class="sous">${tous.length - cmpt[0]} fiches vues</span></header>
      <div class="carte"><div class="boites">${[1, 2, 3, 4, 5].map(b => `<div><b class="chiffre">${cmpt[b]}</b><span class="col b${b}" style="height:${Math.max(6, 100 * cmpt[b] / maxB)}%"></span><small>${libs[b]}</small></div>`).join('')}</div>
      <p class="sous" style="margin:12px 0 0">Une fiche réussie monte d'une case et revient de plus en plus tard (1, 3, 7, 16 puis 35 jours). Une erreur la renvoie au début.</p></div></section>
    <section class="section"><header><h2>12 dernières semaines</h2></header><div class="carte"><div class="calendrier">${jours.map(n => `<i data-n="${n}"></i>`).join('')}</div></div></section>
    <section class="section"><header><h2>Par catégorie</h2></header><div class="carte cat-maitrise">${cats.map(([i, n, p]) => `<div><span style="font-size:20px">${i}</span><span><b>${esc(n)}</b><span class="barre" style="display:block;margin-top:5px"><i style="width:${p}%"></i></span></span><span class="pct chiffre">${p}%</span></div>`).join('')}</div></section>`;
}

/* ---------- Correction d'une réponse tapée ---------- */
const ARTICLES = /^(le|la|les|l|un|une|des|du|de la|de l|d|the)\s+/;
function norm(s) {
  return String(s || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/['’`]/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim()
    .replace(ARTICLES, '').trim();
}
function distance(a, b) {                       // Levenshtein
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prec = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prec[j] + 1, cur[j - 1] + 1, prec[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prec = cur;
  }
  return prec[n];
}
// Formes acceptées : chaque élément d'une liste « A · B », sans parenthèses, et le dernier mot d'un nom composé s'il est assez long
function formes(attendu, estNom) {
  const out = new Set();
  for (const partie of String(attendu).split(/\s·\s|\s\/\s/)) {
    const sansPar = partie.replace(/\([^)]*\)/g, ' ');
    for (const v of [partie, sansPar]) {
      const n = norm(v); if (!n) continue; out.add(n);
      const mots = n.split(' ');
      if (estNom && mots.length > 1 && mots[mots.length - 1].length >= 4) out.add(mots[mots.length - 1]);
    }
  }
  return [...out];
}
function corriger(tape, attendu, estNom) {
  if (!norm(tape)) return {verdict: 'faux', raison: 'Pas de réponse'};
  if (norm(tape) === norm(attendu)) return {verdict: 'juste'};
  // plusieurs éléments tapés (« Monet, Renoir » ou « A · B ») : un seul élément juste suffit
  const morceaux = String(tape).split(/\s*[,;·]\s*|\s+et\s+/).filter(m => norm(m));
  let presque = false;
  for (const m of morceaux) {
    const r = corrigerUn(norm(m), attendu, estNom);
    if (r.verdict === 'juste' && !r.presque) return r;
    if (r.verdict === 'juste') presque = true;
  }
  return presque ? {verdict: 'juste', presque: true} : {verdict: 'faux'};
}
function corrigerUn(t, attendu, estNom) {
  const annees = String(attendu).match(/\d{3,4}/g);
  if (annees && /^\d{3,4}$/.test(t)) return annees.includes(t) ? {verdict: 'juste'} : {verdict: 'faux'};
  let meilleure = Infinity;
  for (const f of formes(attendu, estNom)) {
    if (t === f) return {verdict: 'juste'};
    const tol = f.length <= 4 ? 0 : f.length <= 8 ? 1 : 2;
    const d = distance(t, f);
    if (d <= tol) meilleure = Math.min(meilleure, d);
  }
  return meilleure < Infinity ? {verdict: 'juste', presque: true} : {verdict: 'faux'};
}

/* ---------- Séances : révision (sans Éclats) et quiz du jour (barème) ---------- */
let seance = null;
const melanger = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const QUI = {peintres: 'Qui est ce peintre ?', mythologie: 'Quelle est cette figure ?', fromages: 'Quel est ce fromage ?', monuments: 'Quel est ce monument ?'};
function fabriquerQuestion(it) {
  const courts = it.champs.map(([k, v], i) => ({k, v, i})).filter(({v}) => v && v.length <= 60);
  if (courts.length && Math.random() < .45) {
    const {k, v} = courts[Math.floor(Math.random() * courts.length)];
    return {it, type: 'champ', enonce: `${k} : ${it.nom} ?`, bonne: v, estNom: false};
  }
  return {it, type: 'image', enonce: QUI[it.liste.id] || 'Qui est-ce ?', bonne: it.nom, estNom: true};
}
function lancerSeance(listeId, mode) {
  let pool = listeId ? tous.filter(it => it.liste.id === listeId) : tous, choisis;
  if (mode === 'quiz') choisis = melanger(tous).slice(0, 20);
  else {
    choisis = mode === 'nouvelles' ? pool.filter(it => niveau(it.id) === 0) : [...pool.filter(it => niveau(it.id) >= 1 && niveau(it.id) <= 2), ...pool.filter(it => niveau(it.id) === 0).slice(0, 4)];
    if (choisis.length < 6) choisis = choisis.concat(melanger(pool.filter(it => !choisis.includes(it))).slice(0, 10 - choisis.length));
    choisis = melanger(choisis).slice(0, 10);
  }
  seance = {mode: mode === 'quiz' ? 'quiz' : 'revision', questions: choisis.map(fabriquerQuestion), n: 0, reponses: []};
  $('#seance').classList.add('ouverte'); document.body.style.overflow = 'hidden';
  rendreQuestion();
}
function fermerSeance() { $('#seance').classList.remove('ouverte'); document.body.style.overflow = ''; seance = null; rendre(); }
const bonnes = () => seance.reponses.filter(r => r.juste).length;

function rendreQuestion() {
  const q = seance.questions[seance.n], r = seance.reponses[seance.n], fini = !!r, quiz = seance.mode === 'quiz';
  $('#seance').innerHTML = `<div class="app"><div class="progres-seance"><button id="quitter" aria-label="Quitter">${ic('x')}</button>
    <div class="barre"><i style="width:${100 * (seance.n + (fini ? 1 : 0)) / seance.questions.length}%"></i></div>
    ${quiz ? `<span class="pastille eclats chiffre">${bonnes()} / ${seance.questions.length}</span>` : `<span class="sous chiffre">${seance.n + 1} / ${seance.questions.length}</span>`}</div>
    <div class="question monte">
      ${quiz ? `<span class="etiquette" style="color:var(--eclat)">Quiz du jour · ${esc(q.it.liste.nom)}</span>` : ''}
      ${q.type === 'image' ? `<div class="visuel"><img src="${q.it.image}" alt="Image à reconnaître"></div>` : `<div class="contexte"><img src="${q.it.image}" alt=""><span class="etiquette">${esc(q.it.liste.nom)}</span></div>`}
      <div class="enonce">${esc(q.enonce)}</div>
      ${fini ? `<div class="saisie-faite ${r.juste ? 'ok' : 'ko'}"><span class="sous">Ta réponse</span><b>${r.tape ? esc(r.tape) : '<i>Je ne sais pas</i>'}</b></div>` : `
      <form class="saisie" id="saisie" autocomplete="off">
        <input id="rep" type="text" enterkeyhint="done" autocapitalize="off" spellcheck="false" placeholder="Tape ta réponse" aria-label="Ta réponse">
        <button class="bouton memo" type="submit">Valider</button>
      </form>
      <button class="lien" id="passe" style="justify-self:center">Je ne sais pas</button>`}
      ${fini ? `<div class="retour-fiche ${r.juste ? 'ok' : 'ko'} monte">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
            <span class="verdict">${r.juste ? (r.presque ? 'Juste, à une lettre près' : 'Juste !') : 'Faux'}</span>
            ${r.corrige ? '<span class="badge">corrigé par toi</span>' : ''}</div>
          ${r.presque && r.juste ? `<div class="sous">Orthographe : <b style="color:var(--encre)">${esc(q.bonne)}</b></div>` : ''}
          <dl><dt>Nom</dt><dd>${esc(q.it.nom)}</dd>${q.it.champs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
          <button class="corriger" id="corriger">${r.juste ? `${ic('x')} Compter comme faux` : `${ic('check')} En fait, j'avais juste`}</button>
        </div>
        <button class="bouton ${quiz ? 'eclat' : 'memo'} large suite-fixe" id="suite">${seance.n + 1 < seance.questions.length ? 'Question suivante' : 'Voir le résultat'} ${ic('caret-right')}</button>` : ''}
    </div></div>`;
  $('#quitter').onclick = fermerSeance;
  if (!fini) {
    const champ = $('#rep'); setTimeout(() => champ.focus(), 50);
    $('#saisie').onsubmit = e => { e.preventDefault(); repondre(champ.value); };
    $('#passe').onclick = () => repondre('');
  } else {
    $('#corriger').onclick = () => { r.juste = !r.juste; r.corrige = !r.corrige; r.presque = false; appliquer(q, r); rendreQuestion(); };
    $('#suite').onclick = () => { seance.n++; seance.n < seance.questions.length ? rendreQuestion() : rendreFin(); $('#seance').scrollTo({top: 0}); };
  }
}
function appliquer(q, r) {           // la fiche monte d'un niveau si juste, revient au niveau 1 sinon
  if (r.avant === undefined) r.avant = niveau(q.it.id);
  etat.boites[q.it.id] = r.juste ? Math.min(5, r.avant + 1) : 1;
  sauver();
}
function repondre(tape) {
  const q = seance.questions[seance.n];
  const c = corriger(tape, q.bonne, q.estNom);
  const r = {tape: tape.trim(), juste: c.verdict === 'juste', presque: !!c.presque, corrige: false};
  seance.reponses[seance.n] = r;
  appliquer(q, r);
  etat.faits++; sauver();
  if (navigator.vibrate) try { navigator.vibrate(r.juste ? 12 : [20, 40, 20]); } catch {}
  rendreQuestion();
}
function rendreFin() {
  const total = seance.questions.length, n = bonnes(), quiz = seance.mode === 'quiz';
  const corriges = seance.reponses.filter(r => r.corrige).length;
  const montees = seance.reponses.filter(r => r.juste).length, arevoir = total - n;
  let gain = 0;
  if (quiz) { gain = gainPour(n); etat.eclats += gain; etat.quizJour = {score: n, gain}; }
  if (etat.faits >= 20 && etat.jour === 0) { etat.serie++; etat.jour = 1; }
  sauver();
  $('#seance').innerHTML = `<div class="app"><div class="fin">
    <span class="etiquette" ${quiz ? 'style="color:var(--eclat)"' : ''}>${quiz ? 'Quiz du jour terminé' : 'Révision terminée'}</span>
    <div class="score chiffre monte">${n}<span style="font-size:32px;color:var(--doux)"> / ${total}</span></div>
    <h2>${n === total ? 'Sans faute !' : n >= total * .7 ? 'Très bien joué' : 'On continue demain'}</h2>
    ${quiz ? `<div class="eclats-gagnes monte" style="animation-delay:.15s">+${gain} ${eclat()}</div>
      ${blocBareme(n)}
      <p class="sous" style="margin:0">Crédités dans le registre commun.${corriges ? ` ${corriges} correction${corriges > 1 ? 's' : ''} manuelle${corriges > 1 ? 's' : ''} prise${corriges > 1 ? 's' : ''} en compte.` : ''}</p>`
    : `<p class="sous" style="margin:0">Les révisions ne rapportent pas d'Éclats : c'est le quiz du jour qui en donne.</p>`}
    <div class="bilan monte" style="animation-delay:.25s"><div><b class="chiffre">${montees}</b><span>fiches en progrès</span></div><div><b class="chiffre">${arevoir}</b><span>à revoir demain</span></div><div><b class="chiffre">${etat.serie} j</b><span>de série</span></div></div>
    ${quiz ? '' : `<button class="bouton memo large" id="encore">${ic('lightning', 'fill')} Encore une révision</button>`}
    <button class="bouton fantome large" id="finir">Terminer</button></div></div>`;
  const e = $('#encore'); if (e) e.onclick = () => lancerSeance();
  $('#finir').onclick = fermerSeance;
}

/* ---------- rendu ---------- */
function rendre() {
  const vues = {aujourdhui: vueAujourdhui, listes: vueListes, liste: vueListe, progres: vueProgres};
  $('#racine').innerHTML = `<div class="app">${vues[page]()}<p class="bandeau">Maquette de la refonte de Mémo · données de progression simulées</p></div>`;
  rendreOnglets();
  const go = $('#go'); if (go) go.onclick = () => lancerSeance();
  const qj = $('#quiz-jour'); if (qj) qj.onclick = () => lancerSeance(null, 'quiz');
  const raz = $('#raz'); if (raz) raz.onclick = () => { etat.quizJour = null; sauver(); rendre(); };
  document.querySelectorAll('[data-liste]').forEach(b => b.onclick = () => { listeOuverte = b.dataset.liste; page = 'liste'; affichage = 'fiches'; rendre(); window.scrollTo({top: 0}); });
  document.querySelectorAll('[data-fiche]').forEach(b => b.onclick = () => ouvrirFiche(b.dataset.fiche));
  document.querySelectorAll('[data-onglet-lien]').forEach(b => b.onclick = () => { page = b.dataset.ongletLien; rendre(); });
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { filtreCat = b.dataset.cat; rendre(); });
  document.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => { affichage = b.dataset.vue; rendre(); });
  document.querySelectorAll('[data-reviser]').forEach(b => b.onclick = () => lancerSeance(b.dataset.reviser, b.dataset.mode));
  const ret = $('#retour'); if (ret) ret.onclick = () => { page = 'listes'; rendre(); };
  const rech = $('#rech'); if (rech) rech.oninput = () => { recherche = rech.value; const pos = rech.selectionStart; rendre(); const n = $('#rech'); n.focus(); n.setSelectionRange(pos, pos); };
}
rendre();
</script>
