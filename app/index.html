<link rel="stylesheet" href="style.css">
<script>
  // Chrome Android : le menu « Installer » se croit « déjà installé » sur tout
  // site qui héberge une autre appli installée (blinytz.github.io). L'événement
  // beforeinstallprompt, lui, vérifie la bonne adresse : on le garde pour
  // proposer l'installation depuis la page.
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window.__installation = e;
    document.dispatchEvent(new Event('installable'));
  });
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="racine"><div class="app"><p class="sous" style="padding-top:40px">Chargement de Mnémo…</p></div></div>
<div class="seance" id="seance" role="dialog" aria-label="Séance"></div>
<div class="voile" id="voile"><div class="feuille" id="feuille" role="dialog" aria-label="Fiche"></div></div>
<div class="onglets" id="onglets"><nav aria-label="Navigation principale"></nav></div>
<div class="toast" id="toast" role="status" hidden></div>
<button class="mise-a-jour" id="mise-a-jour" hidden>Actualiser</button>
</body>
</html>
