name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exporter les listes pour la nouvelle version
        # memo.html reste la source (l'Atelier en ligne y écrit) : les données de
        # app/ sont refaites à chaque publication
        run: node build/exporter_donnees.mjs
      - name: Préparer le site
        run: |
          mkdir -p _site/atelier
          # numéro de version relu par l'application installée pour se mettre à jour
          echo "{\"version\": \"$GITHUB_SHA\"}" > _site/version.json
          cp index.html memo.html maquette.html manifest.json sw.js _site/
          cp icone.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/
          cp -R thumbs full originaux data app _site/
          rm -rf _site/app/tests _site/app/package.json
          rm -rf _site/data/atelier/history
          # Atelier en ligne : même adresse que l'ancienne copie memo-web
          cp atelier-en-ligne/atelier.html _site/
          cp atelier-en-ligne/app.js atelier-en-ligne/image-editor.js atelier-en-ligne/memo-html.js atelier-en-ligne/style.css _site/atelier/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
